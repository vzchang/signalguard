name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  harness-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: run all demos, tests, and charts
        run: python3 run_all.py
        working-directory: harness

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff mypy numpy
      - run: ruff check .
      - name: mypy
        run: mypy --ignore-missing-imports .
        working-directory: harness

  # A pre-commit hook can be bypassed with --no-verify, so the same scan runs here
  # where it cannot be. See .pre-commit-config.yaml.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  risk-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: mypy --strict risk
      - run: coverage run -m pytest risk
        env:
          HYPOTHESIS_PROFILE: ci
      - run: coverage report

  # Slow, and it only has to prove the tests bite once, so one Python version.
  risk-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: mutmut run
        env:
          HYPOTHESIS_PROFILE: ci
      - run: python .github/scripts/check_mutants.py
